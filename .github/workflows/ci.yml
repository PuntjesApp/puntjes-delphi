name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  planner:
    name: Dispatch planner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -t .

  # A hand edit under src, or a generator bump with no regeneration, turns this red. Then the example must compile.
  units:
    name: Generate and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install FPC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fpc
      - run: scripts/mormot.sh
      - name: Regenerate from spec/api.json
        run: scripts/generate.sh
      - name: Fail on any difference
        run: |
          git status --porcelain -- src
          test -z "$(git status --porcelain -- src)"
      - name: Compile the example with fpc -Mdelphi
        run: scripts/compile.sh

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        run: pipx run zizmor==1.30.1 --offline .github/workflows

  # The one check the main ruleset requires, so a change to the jobs above never edits the ruleset.
  ci:
    name: CI
    needs: [planner, units, workflows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLANNER: ${{ needs.planner.result }}
          UNITS: ${{ needs.units.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: test "$PLANNER" = success && test "$UNITS" = success && test "$WORKFLOWS" = success
