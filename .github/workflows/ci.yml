name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a retitle to feat!: runs the API check again
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  planner:
    name: Dispatch planner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -t .

  # A hand edit under src, or a generator bump with no regeneration, turns this red. Then the example must compile.
  units:
    name: Generate and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install FPC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fpc
      - run: scripts/mormot.sh
      - name: Regenerate from spec/api.json
        run: scripts/generate.sh
      - name: Fail on any difference
        run: |
          git status --porcelain -- src
          test -z "$(git status --porcelain -- src)"
      - name: Compile the example with fpc -Mdelphi
        run: scripts/compile.sh

  # A removed or changed public declaration since the last release fails a PR whose title is not feat!:.
  # So a breaking regenerate PR does not merge itself.
  api:
    name: Public API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare the interface sections with the last release
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: python3 tools/api_surface.py

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        run: pipx run zizmor==1.30.1 --offline .github/workflows

  # The one check the main ruleset requires, so a change to the jobs above never edits the ruleset.
  ci:
    name: CI
    needs: [planner, units, api, workflows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          PLANNER: ${{ needs.planner.result }}
          UNITS: ${{ needs.units.result }}
          API: ${{ needs.api.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: test "$PLANNER" = success && test "$UNITS" = success && test "$API" = success && test "$WORKFLOWS" = success
